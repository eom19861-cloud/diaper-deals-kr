<body>
<div class="wrap">
  <header class="hero">
    <p class="hero__eyebrow">쿠팡 기준 1매당 최저가 비교</p>
    <h1 class="hero__title">기저귀·물티슈<br />쿠팡 단가 계산기</h1>
    <p class="hero__desc">쿠팡에서 파는 상품만 모았습니다. 같은 돈이면 몇 매를 사는지 — 총 가격이 아니라 <strong>1매당 가격</strong>으로 비교하세요.</p>
    <div class="hero__meta">
      <span class="dot" aria-hidden="true"></span>
      <span id="updatedAt">불러오는 중…</span>
    </div>
  </header>

  <div id="partnersNotice" class="notice" hidden></div>

  <nav class="tabs" role="tablist" aria-label="카테고리">
    <button class="tab is-active" role="tab" aria-selected="true" data-category="diaper">기저귀</button>
    <button class="tab" role="tab" aria-selected="false" data-category="wipe">아기 물티슈</button>
  </nav>

  <section id="listView">
    <section class="calc" id="calcPanel" aria-labelledby="calcKicker">
      <button class="calc__toggle" id="calcToggle" type="button" aria-expanded="false" aria-controls="calcBody">
        <span class="calc__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0f5440" stroke-width="1.7" stroke-linecap="round">
            <rect x="4" y="2.5" width="16" height="19" rx="3.2" />
            <path d="M8 7.2h8" />
            <circle cx="8.6" cy="11.8" r=".95" fill="#0f5440" stroke="none" />
            <circle cx="12" cy="11.8" r=".95" fill="#0f5440" stroke="none" />
            <circle cx="15.4" cy="11.8" r=".95" fill="#0f5440" stroke="none" />
            <circle cx="8.6" cy="16.2" r=".95" fill="#0f5440" stroke="none" />
            <circle cx="12" cy="16.2" r=".95" fill="#0f5440" stroke="none" />
            <circle cx="15.4" cy="16.2" r=".95" fill="#0f5440" stroke="none" />
          </svg>
        </span>
        <span class="calc__heading">
          <span class="calc__kicker" id="calcKicker">1매당 단가 계산기</span>
          <span class="calc__peek" id="calcPeek">마트 가격도 3초 만에 비교</span>
        </span>
        <span class="calc__chev" aria-hidden="true"></span>
      </button>

      <div class="calc__body" id="calcBody" hidden>
        <div class="calc__form">
          <label class="field field--wide">
            <span class="field__label">총 결제 금액(원, 배송비 포함)</span>
            <input id="calcPrice" class="input" type="number" inputmode="numeric" min="0" step="100" placeholder="예: 42900" />
          </label>

          <div class="calc__modes" role="group" aria-label="매수 입력 방식">
            <button class="calc__mode-btn is-active" type="button" data-mode="packs" aria-pressed="true">팩으로 입력</button>
            <button class="calc__mode-btn" type="button" data-mode="total" aria-pressed="false">총 매수로 입력</button>
          </div>

          <div class="calc__pairs" id="calcPackFields">
            <label class="field">
              <span class="field__label">팩당 매수</span>
              <input id="calcPerPack" class="input" type="number" inputmode="numeric" min="1" step="1" placeholder="예: 30" />
            </label>
            <label class="field">
              <span class="field__label">팩 수</span>
              <input id="calcPackCount" class="input" type="number" inputmode="numeric" min="1" step="1" value="1" />
            </label>
          </div>

          <label class="field field--wide" id="calcTotalField" hidden>
            <span class="field__label">총 매수</span>
            <input id="calcTotalCount" class="input" type="number" inputmode="numeric" min="1" step="1" placeholder="예: 120" />
          </label>
        </div>

        <div class="calc__result" id="calcResult" aria-live="polite">
          <p class="calc__hint">금액과 매수를 입력하면 1매당 가격과 비교 결과가 나옵니다.</p>
        </div>
        <p class="calc__basis" id="calcBasis"></p>
      </div>
    </section>

    <div class="filters" id="filters">
      <div class="filters__row">
        <label class="field">
          <span class="field__label">브랜드</span>
          <select id="filterBrand" class="select"></select>
        </label>
        <label class="field" id="stageField">
          <span class="field__label">단계</span>
          <select id="filterStage" class="select"></select>
        </label>
        <label class="field" id="typeField">
          <span class="field__label">타입</span>
          <select id="filterType" class="select"></select>
        </label>
        <label class="field" id="formField" hidden>
          <span class="field__label">형태</span>
          <select id="filterForm" class="select"></select>
        </label>
        <label class="field field--sort">
          <span class="field__label">정렬</span>
          <select id="sortBy" class="select">
            <option value="unit">1매당 최저가순</option>
            <option value="total">총 구매가순</option>
            <option value="updated">최신 갱신순</option>
          </select>
        </label>
      </div>
      <div class="filters__summary">
        <span id="resultCount">–</span>
        <button id="resetFilters" class="link" type="button">필터 초기화</button>
      </div>
    </div>

    <ul id="cards" class="cards" aria-live="polite"></ul>
    <p id="emptyState" class="empty" hidden>조건에 맞는 상품이 없습니다. 필터를 바꿔 보세요.</p>
  </section>

  <footer class="foot">
    <ul id="footNotes" class="foot__notes"></ul>
    <p class="foot__src">쿠팡 기준 · 데이터 <code>data/products.json</code> · 설정 <code>data/config.json</code></p>
  </footer>
</div>
<script src="app.js" defer></script>
</body>
